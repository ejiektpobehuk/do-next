[package]
name = "do-next"
description = "Pick your next Jira task & manage it from the terminal"
version = "0.0.0-2026.7.14"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ejiektpobehuk/do-next"
readme = "README.md"
authors = ["Vlad Petrov <oss@ejiek.id>"]
keywords = ["jira", "tui", "task-management", "productivity", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "do-next"
path = "src/main.rs"

[dependencies]
ratatui    = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm  = { version = "0.29", features = ["event-stream"] }
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.13", features = ["json", "rustls", "query", "multipart", "form"], default-features = false }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
json5      = "1.3"
clap            = { version = "4", features = ["derive"] }
clap_complete   = "4"
keyring    = { version = "4", features = ["v1"] }
anyhow     = "1"
log        = "0.4"
simplelog  = "0.12"
thiserror  = "2"
dirs       = "6"
open       = "5"
chrono     = { version = "0.4", features = ["serde"] }
futures    = "0.3"
indexmap      = "2"
image         = "0.25"
ratatui-image = { version = "11", features = ["crossterm", "image-defaults"], default-features = false }
pulldown-cmark = "0.13"
tiny_http      = "0.12"
rand           = "0.10"
base64         = "0.23"
sha2           = "0.11"

[dev-dependencies]
tempfile = "3"

# The strict set every tool sees — clippy, bacon, rust-analyzer alike.
# `priority = -1` keeps the groups below any single-lint override, so the
# per-item `#[allow(clippy::…)]` attributes in src/ still win.
[lints.clippy]
pedantic    = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
unwrap_used = "warn"
